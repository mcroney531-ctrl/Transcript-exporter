<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Export Claude Conversation</title>
<style>
  body {
    width: 300px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 16px;
    color: #1f1f1f;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 12px;
  }
  fieldset {
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 8px 10px;
    margin: 0 0 12px;
  }
  legend {
    font-size: 12px;
    color: #666;
    padding: 0 4px;
  }
  label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    padding: 3px 0;
    cursor: pointer;
  }
  button {
    width: 100%;
    padding: 9px;
    font-size: 13px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    background: #c15f3c;
    color: white;
    cursor: pointer;
  }
  button:disabled {
    background: #d9b3a4;
    cursor: default;
  }
  #status {
    margin-top: 10px;
    font-size: 12px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #status.error { color: #b3261e; }
  #status.success { color: #2e7d32; }
  #status.info { color: #555; }
  #diagBox {
    display: none;
    margin-top: 8px;
  }
  #diagBox textarea {
    width: 100%;
    box-sizing: border-box;
    height: 100px;
    font-size: 10px;
    font-family: monospace;
  }
  #copyDiag {
    margin-top: 6px;
    background: #555;
  }
</style>
</head>
<body>
  <h1>Export Claude Conversation</h1>

  <fieldset>
    <legend>Format</legend>
    <label><input type="radio" name="format" value="markdown" checked /> Markdown (.md)</label>
    <label><input type="radio" name="format" value="text" /> Plain text (.txt)</label>
  </fieldset>

  <button id="exportBtn">Export Conversation</button>

  <div id="status"></div>

  <div id="diagBox">
    <textarea id="diagText" readonly></textarea>
    <button id="copyDiag">Copy diagnostics</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
